<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SmarHamr Workbench — Dexie Editor</title>

    <link rel="stylesheet" href="smarhamr-ui.css">

    <!-- Pako for gzip/ungzip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <!-- Dexie Loader / Editor Logic -->
    <script src="workbench-dexie.js"></script>

    <style>
        #dexieEditor {
            font-family: monospace;
            background: #111;
            color: #eee;
            border: 1px solid #444;
            padding: 10px;
            resize: none;
            width: 100%;
            height: calc(100vh - 140px);
        }
        .button-small {
            padding: 6px 12px;
            margin: 4px;
            background: #222;
            border: 1px solid #555;
            color: #eee;
            cursor: pointer;
        }
        .button-small:hover {
            background: #333;
        }
        #loaderToolbox {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #444;
        }
        #layout {
            display: flex;
            height: calc(100vh - 40px);
        }
        .left-nav {
            width: 220px;
            border-right: 1px solid #444;
            padding: 10px;
            overflow-y: auto;
        }
        .workspace {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }
        #topbar {
            height: 40px;
            border-bottom: 1px solid #444;
            padding: 10px;
            font-size: 1.2rem;
            color: #eee;
            background: #111;
        }
    </style>
</head>

<body>

    <!-- Top Bar -->
    <div id="topbar">SmarHamr Dexie Workbench</div>

    <div id="layout">

        <!-- Left Navigation -->
        <div class="left-nav">

            <!-- Loader Toolbox -->
            <div id="loaderToolbox">
                <button class="button-small" onclick="document.getElementById('workbenchFileInput').click()">Load File</button>
                <button class="button-small" onclick="exportGzipped()">Export</button>

                <input type="file" id="workbenchFileInput"
                       accept=".json,.gz,.json.gz"
                       style="display:none;">
            </div>

            <h3>Tables</h3>
            <div id="dexieTableList"></div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div id="dexieWorkspace">
                <p style="color:#888;">Load a Dexie JSON or JSON.GZ export to begin.</p>
            </div>
        </div>

    </div>

</body>
</html>
