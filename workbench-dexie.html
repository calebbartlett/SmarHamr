<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SmarHamr Dexie Workbench</title>

    <link rel="stylesheet" href="smarhamr-ui.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="workbench-dexie.js"></script>
</head>
<body>

    <div id="topbar">
        <div id="topbar-left">
            <span id="currentFileName">No file loaded</span>
        </div>
        <div id="topbar-center">
            <button class="topbar-button active">Dexie Editor</button>
        </div>
        <div id="topbar-right">
            SmarHamr Workbench
        </div>
    </div>

    <div id="layout">

        <div class="left-nav">
            <h2>Dexie Loader</h2>
            <div class="panel">
                <button class="button mb-10" onclick="document.getElementById('workbenchFileInput').click()">Load File</button>
                <button class="button" onclick="exportGzipped()">Export</button>
                <input type="file" id="workbenchFileInput"
                       accept=".json,.gz,.json.gz"
                       style="display:none;">
            </div>

            <h2 class="mt-20">Table & Row</h2>
            <div class="panel">
                <div class="panel-header">Table</div>
                <select id="tableSelect" onchange="onTableSelected()">
                    <option value="">-- Select Table --</option>
                </select>

                <div class="panel-header mt-10">Row</div>
                <select id="rowSelect" onchange="onRowSelected()">
                    <option value="">-- Select Row --</option>
                </select>
            </div>

            <h2 class="mt-20">Advanced Tools</h2>
            <div class="panel">
                <div class="panel-header">Persona & Profile</div>

                <button class="button mb-10"
                        onclick="onLoadCleanSmarHamrProfile()">
                    Load Clean SmarHamr Profile
                </button>

                <button class="button"
                        onclick="onInsertSmarHamrTutor()">
                    Insert SmarHamr Tutor
                </button>

                <p class="mt-10" style="font-size:0.85rem;color:var(--text-dim);">
                    Uses ID namespace starting at <code>33300</code> so user data stays safe.
                </p>
            </div>
        </div>

        <div class="workspace">
            <div class="panel">
                <div class="panel-header">Dexie JSON</div>
                <textarea id="dexieEditor"
                          placeholder="Load a Dexie JSON or JSON.GZ file to begin."></textarea>
            </div>

            <div class="panel" id="rowEditorPanel" style="display:none;">
                <div class="panel-header">Row Editor</div>
                <textarea id="rowEditor"
                          placeholder="Select a table and row to edit its JSON."></textarea>
            </div>
        </div>

    </div>

</body>
</html>
