<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Workbench — Dexie Editor</title>

    <link rel="stylesheet" href="smarhamr-ui.css">
    <script src="smarhamr-workbench-ui.js"></script>
    <script src="workbench-dexie.js"></script>
</head>

<body>

    <!-- Shared Top Bar -->
    <div id="topbar"></div>

    <div id="layout">

        <!-- Left Navigation -->
        <div class="left-nav">
            <div id="loaderToolbox"></div>

            <h2>Tables</h2>
            <div id="dexieTableList"></div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="panel">
                <div class="panel-header">Dexie Table Editor</div>
                <div id="dexieWorkspace"></div>
            </div>
        </div>

    </div>

    <!-- Clipboard -->
    <div id="clipboardTab">Clipboard</div>
    <div id="clipboardPanel">
        <textarea id="clipboardText"></textarea>
    </div>

    <script>
        smarhamrCurrentMode = "dexie";
        initTopBar();
        // loader toolbox will be added later
    </script>

</body>
</html>
