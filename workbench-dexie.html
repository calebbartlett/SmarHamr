<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Workbench — Dexie Editor</title>

    <link rel="stylesheet" href="smarhamr-ui.css">
    <script src="smarhamr-workbench-ui.js"></script>

    <!-- Validator + Cleaner Modules -->
    <script src="dexie-validator.js"></script>
    <script src="dexie-cleaner.js"></script>

    <!-- Main Dexie Workbench Logic -->
    <script src="workbench-dexie.js"></script>

    <style>
        #dexieWorkspace {
            width: 100%;
            height: 500px;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
            resize: vertical;
        }

        #dexie-validation-panel {
            margin-top: 12px;
            padding: 10px;
            background: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        #dexie-fixall-btn {
            margin-top: 8px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Shared Top Bar -->
    <div id="topbar"></div>

    <div id="layout">

        <!-- Left Navigation -->
        <div class="left-nav">
            <div id="loaderToolbox"></div>

            <h2>Tables</h2>
            <div id="dexieTableList"></div>
        </div>

        <!-- Workspace -->
        <div class="workspace">
            <div class="panel">
                <div class="panel-header">Dexie Table Editor</div>

                <!-- Main JSON Workspace -->
                <textarea id="dexieWorkspace"></textarea>

                <!-- Validator + Cleaner Panel -->
                <div id="dexie-validation-panel">
                    <div id="dexie-status">Ready.</div>

                    <button id="dexie-fixall-btn">
                        Fix All Issues
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- Clipboard -->
    <div id="clipboardTab">Clipboard</div>
    <div id="clipboardPanel">
        <textarea id="clipboardText"></textarea>
    </div>

    <script>
        smarhamrCurrentMode = "dexie";
        initTopBar();
    </script>

</body>
</html>
