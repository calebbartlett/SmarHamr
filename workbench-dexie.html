<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SmarHamr Workbench — Dexie Editor</title>

    <link rel="stylesheet" href="smarhamr-ui.css">
    <script src="smarhamr-workbench-ui.js"></script>
</head>

<body>

    <!-- Shared Top Bar -->
    <div id="topbar"></div>

    <!-- Main Layout -->
    <div id="layout">

        <!-- Left Navigation -->
<div class="left-nav">

    <!-- Loader Toolbox -->
    <div id="dexieToolbox" style="padding: 10px; border-bottom: 1px solid var(--border);">
        <button class="button-small" onclick="openDexieFile()">File</button>
        <button class="button-small" onclick="saveDexieChanges()">Save</button>
        <button class="button-small" onclick="exportDexieJson()">Export</button>

        <!-- Hidden file input -->
        <input type="file" id="dexieFileInput" style="display:none"
               accept=".json,.gz,.json.gz">
    </div>

    <h2>Tables</h2>
    <div id="dexieTableList"></div>
</div>


        <!-- Workspace -->
        <div class="workspace">
            <div class="panel">
                <div class="panel-header">Dexie Table Editor</div>
                <div id="dexieWorkspace"></div>
            </div>
        </div>

    </div>

    <!-- Clipboard -->
    <div id="clipboardTab">Clipboard</div>
    <div id="clipboardPanel">
        <textarea id="clipboardText"></textarea>
    </div>

    <script>
        smarhamrCurrentMode = "dexie";
        initTopBar();
    </script>

</body>
</html>
