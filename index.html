<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SmarHamr</title>

    <link rel="stylesheet" href="smarhamr-ui.css">

    <style>
        body {
            overflow-y: auto; /* allow scrolling */
            text-align: center; /* center everything */
            padding: 40px 0;
        }

        #faqBox {
            width: 80%;
            max-width: 700px;
            height: 200px;
            margin: 30px auto;
            padding: 14px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            resize: none;
        }

        .tool-button {
            padding: 12px 20px;
            margin: 10px;
            background: var(--bg-nav);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text);
            transition: var(--transition);
            font-size: 1rem;
        }

        .tool-button:hover {
            background: var(--accent-hover);
        }
    </style>
</head>

<body>

    <h1>SmarHamr</h1>
    <div style="font-size: 0.9rem; color: var(--text-dim); margin-top: -10px;">
        by Yggdrasil75
    </div>

    <p style="color: var(--text-dim); font-size: 1.1rem;">
        A unified way to explore and edit personas for character or world building.
    </p>
